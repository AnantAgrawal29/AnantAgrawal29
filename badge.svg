<svg width="260" height="380" viewBox="0 0 260 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1450"/>
      <stop offset="100%" stop-color="#120b3d"/>
    </linearGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#1f3fe0"/>
      <stop offset="100%" stop-color="#e8434b"/>
    </linearGradient>
    <pattern id="badgeDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c9bdfb" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- lanyard strap -->
  <path d="M 108 0 L 152 0 L 140 60 L 120 60 Z" fill="url(#strap)"/>
  <circle cx="130" cy="66" r="9" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="130" cy="66" r="3.4" fill="#120b3d"/>

  <!-- card body -->
  <g transform="translate(10,78)">
    <rect x="0" y="0" width="240" height="292" rx="16" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="0" y="0" width="240" height="292" rx="16" fill="url(#badgeDots)"/>

    <!-- top glitch stripe -->
    <path d="M 0 16 Q 120 -6 240 16 L 240 44 Q 120 24 0 44 Z" fill="url(#strap)"/>

    <!-- web corner accents -->
    <g stroke="#c9bdfb" stroke-width="1" opacity="0.28" fill="none">
      <line x1="0" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="40"/>
      <path d="M0 0 Q 20 8 24 28"/>
      <line x1="240" y1="292" x2="200" y2="292"/>
      <line x1="240" y1="292" x2="240" y2="252"/>
      <path d="M240 292 Q 220 284 216 264"/>
    </g>

    <!-- glitch zigzag accents -->
    <g fill="none" stroke-linecap="round">
      <path d="M 24 60 L 38 68 L 28 76" stroke="#e8434b" stroke-width="2.4" opacity="0.8"/>
      <path d="M 27 63 L 41 71 L 31 79" stroke="#1f3fe0" stroke-width="2.4" opacity="0.6"/>
      <path d="M 210 220 L 224 228 L 214 236" stroke="#1f3fe0" stroke-width="2.4" opacity="0.8"/>
      <path d="M 207 217 L 221 225 L 211 233" stroke="#e8434b" stroke-width="2.4" opacity="0.6"/>
    </g>

    <!-- avatar: spider-mask icon, since no photo -->
    <circle cx="120" cy="110" r="58" fill="#120b3d" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(120,110)">
      <path d="M -48 4 C -48 -30 -22 -52 0 -52 C 22 -52 48 -30 48 4 C 48 30 30 46 18 46 L -18 46 C -30 46 -48 30 -48 4 Z" fill="#e8434b"/>
      <path d="M -30 -4 C -22 -14 -10 -6 -14 6 C -20 16 -34 10 -30 -4 Z" fill="#ffffff"/>
      <path d="M 30 -4 C 22 -14 10 -6 14 6 C 20 16 34 10 30 -4 Z" fill="#ffffff"/>
      <g stroke="#120b3d" stroke-width="1.6" fill="none" opacity="0.85">
        <path d="M0 -50 L 0 46"/>
        <path d="M -46 -8 L 46 -8"/>
        <path d="M -40 16 L 40 16"/>
        <path d="M -34 -28 L 34 -28"/>
      </g>
    </g>

    <!-- name / role -->
    <text x="120" y="205" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="21" fill="#ffffff" letter-spacing="0.5">
      ANANT AGRAWAL
    </text>
    <text x="120" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#ff6f59" letter-spacing="1.5">
      FULL-STACK &#183; AI SYSTEMS
    </text>

    <rect x="30" y="244" width="180" height="1.5" fill="#8b5cf6" opacity="0.7"/>

    <text x="120" y="266" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9bdfb">
      @AnantAgrawal29
    </text>
    <text x="120" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9a8fd6">
      B.Tech CSE &#183; PSIT Kanpur
    </text>
  </g>
</svg>
