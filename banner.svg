<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a4d"/>
      <stop offset="55%" stop-color="#122a6e"/>
      <stop offset="100%" stop-color="#0a1a4d"/>
    </linearGradient>
    <linearGradient id="redSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a11f1f"/>
      <stop offset="100%" stop-color="#e0262c"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e0262c" opacity="0.35"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- halftone comic-dot corner -->
    <rect x="900" y="0" width="300" height="140" fill="url(#dots)"/>

    <!-- web lines fanning from top-right -->
    <g stroke="#ffffff" stroke-width="1.4" opacity="0.28" fill="none">
      <line x1="1180" y1="10" x2="760" y2="300"/>
      <line x1="1180" y1="10" x2="880" y2="300"/>
      <line x1="1180" y1="10" x2="1000" y2="300"/>
      <line x1="1180" y1="10" x2="1120" y2="300"/>
      <line x1="1180" y1="10" x2="1200" y2="150"/>
      <line x1="1180" y1="10" x2="1050" y2="0"/>
      <line x1="1180" y1="10" x2="900" y2="0"/>
      <path d="M 1180 10 Q 950 40 830 190" />
      <path d="M 1180 10 Q 1020 90 950 260" />
      <path d="M 1180 10 Q 1100 150 1080 300" />
      <path d="M 1180 10 Q 1140 60 1200 60" />
    </g>

    <!-- faint web bottom-left -->
    <g stroke="#e0262c" stroke-width="1.2" opacity="0.18" fill="none">
      <line x1="-20" y1="300" x2="260" y2="20"/>
      <line x1="-20" y1="300" x2="140" y2="0"/>
      <line x1="-20" y1="300" x2="380" y2="70"/>
      <path d="M -20 300 Q 120 250 180 120"/>
      <path d="M -20 300 Q 200 260 300 150"/>
    </g>

    <!-- red bottom swoosh -->
    <path d="M 0 300 L 0 235 C 260 180 620 285 900 220 C 1040 188 1140 230 1200 205 L 1200 300 Z" fill="url(#redSwoosh)" opacity="0.92"/>
    <path d="M 0 300 L 0 258 C 300 220 640 296 940 245 C 1070 222 1150 250 1200 232 L 1200 300 Z" fill="#0a1a4d"/>

    <!-- spider emblem, simplified silhouette -->
    <g transform="translate(1085,55) scale(0.9)" fill="#e0262c" opacity="0.9">
      <ellipse cx="0" cy="6" rx="9" ry="16"/>
      <ellipse cx="0" cy="-14" rx="7" ry="8"/>
      <g stroke="#e0262c" stroke-width="2.4" fill="none">
        <path d="M0 -6 C -22 -14 -40 -26 -52 -44"/>
        <path d="M0 -2 C -26 -4 -48 -10 -66 -22"/>
        <path d="M0 4 C -28 6 -50 14 -68 28"/>
        <path d="M0 10 C -22 20 -38 34 -48 52"/>
        <path d="M0 -6 C 22 -14 40 -26 52 -44"/>
        <path d="M0 -2 C 26 -4 48 -10 66 -22"/>
        <path d="M0 4 C 28 6 50 14 68 28"/>
        <path d="M0 10 C 22 20 38 34 48 52"/>
      </g>
    </g>

    <!-- title block -->
    <text x="60" y="130" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="2" transform="skewX(-4)">
      ANANT AGRAWAL
    </text>
    <text x="60" y="130" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="58" fill="none" stroke="#e0262c" stroke-width="1.6" letter-spacing="2" transform="skewX(-4)" opacity="0.8">
      ANANT AGRAWAL
    </text>

    <text x="62" y="168" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#f4c542" letter-spacing="0.5">
      Full-Stack Developer &#183; Building AI-Integrated Systems
    </text>

    <text x="62" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cfd8f0" opacity="0.9">
      React &#183; Java Spring Boot &#183; Node.js &#183; Python / FastAPI &#183; LLM Integration
    </text>

    <rect x="60" y="222" width="230" height="3" fill="#e0262c"/>
  </g>
</svg>
